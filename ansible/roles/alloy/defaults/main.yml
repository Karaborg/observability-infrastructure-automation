---
# The account must exist and be able to read application_log_path.
monitoring_base_dir: "/opt/observability"
monitoring_owner: "{{ ansible_user }}"

# Configure this per environment. Do not commit credentials in this URL.
loki_url: "https://loki.example.com/loki/api/v1/push"

application_name: "example-app"
application_log_path: "/var/log/example-app"
alloy_environment: "development"

alloy_package_name: "alloy"
alloy_config_dir: "{{ monitoring_base_dir }}/alloy"
alloy_config_file: "{{ alloy_config_dir }}/config.alloy"
alloy_version: "1.20.1"
alloy_download_url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-amd64.zip"
alloy_binary: "{{ alloy_config_dir }}/alloy"
alloy_service_file: "/etc/systemd/system/alloy.service"
alloy_service_name: "alloy"

# Resource limits retain compatibility with older systemd releases.
alloy_memory_limit: "256M"
alloy_cpu_quota: "20%"
alloy_tasks_max: 128
alloy_max_log_line_size: "256KiB"
alloy_truncate_suffix: " [TRUNCATED BY ALLOY]"
